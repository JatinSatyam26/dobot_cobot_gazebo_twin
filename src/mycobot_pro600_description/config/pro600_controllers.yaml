/pro600/controller_manager:
  ros__parameters:
    update_rate: 200
    use_sim_time: true
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    pro600_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

/pro600/joint_state_broadcaster:
  ros__parameters:
    use_sim_time: true

/pro600/pro600_arm_controller:
  ros__parameters:
    use_sim_time: true
    joints:
      - pro600_joint1
      - pro600_joint2
      - pro600_joint3
      - pro600_joint4
      - pro600_joint5
      - pro600_joint6
    command_interfaces: [position]
    state_interfaces: [position, velocity]
    allow_partial_joints_goal: false
    constraints:
      stopped_velocity_tolerance: 0.05
      goal_time: 2.0
      pro600_joint1: { trajectory: 0.5, goal: 0.05 }
      pro600_joint2: { trajectory: 0.5, goal: 0.05 }
      pro600_joint3: { trajectory: 0.5, goal: 0.05 }
      pro600_joint4: { trajectory: 0.5, goal: 0.05 }
      pro600_joint5: { trajectory: 0.5, goal: 0.05 }
      pro600_joint6: { trajectory: 0.5, goal: 0.05 }
